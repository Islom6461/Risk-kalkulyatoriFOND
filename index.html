<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZA_ISLAMIC</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg: #0d0d0d;
            --bg-card: #1a1a1a;
            --bg-input: #2a2a2a;
            --border: #333;
            --text: #ffffff;
            --text-dim: #888;
            --green: #4CAF50;
            --red: #F44336;
            --yellow: #FFC107;
            --blue: #2196F3;
        }
        [data-theme="light"] {
            --bg: #f5f5f5;
            --bg-card: #ffffff;
            --bg-input: #f0f0f0;
            --border: #ddd;
            --text: #000000;
            --text-dim: #666;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* ===== ANIMATSIYALI LOGO ===== */
        .logo-wrap {
            overflow: hidden;
            width: 220px;
            height: 30px;
            position: relative;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            white-space: nowrap;
            position: absolute;
            animation: slideLogo 6s ease-in-out infinite;
        }

        .logo span { color: var(--green); transition: color 0.5s; }

        @keyframes slideLogo {
            0%   { transform: translateX(0);      color: #ffffff; }
            25%  { transform: translateX(60px);   color: #4CAF50; }
            50%  { transform: translateX(120px);  color: #2196F3; }
            75%  { transform: translateX(60px);   color: #FFC107; }
            100% { transform: translateX(0);      color: #ffffff; }
        }

        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        /* ===== MENU (o'ngga surilgan) ===== */
        .menu {
            display: flex;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 71px;
            z-index: 99;
            justify-content: flex-end;
            padding-right: 20px;
            gap: 5px;
            overflow-x: auto;
        }
        .menu-btn {
            padding: 12px 18px; background: none; border: none;
            color: var(--text-dim); font-size: 13px; cursor: pointer;
            border-bottom: 2px solid transparent; white-space: nowrap;
            transition: all 0.2s;
        }
        .menu-btn.active { color: var(--text); border-bottom-color: var(--green); font-weight: bold; }
        .menu-btn:hover { color: var(--text); }

        /* ===== CONTENT ===== */
        .content {
            padding: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h2 { font-size: 20px; margin-bottom: 15px; color: var(--text); }

        /* ===== DASHBOARD ===== */
        .asset-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .asset-tab {
            padding: 9px 18px; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-dim); border-radius: 20px; font-size: 13px; cursor: pointer;
            white-space: nowrap; transition: all 0.2s;
        }
        .asset-tab.active { background: var(--green); color: white; border-color: var(--green); }

        /* RESPONSIVE GRID */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .market-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 15px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .market-card:hover { transform: translateY(-3px); border-color: var(--green); }

        .market-name { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
        .market-price { font-size: 22px; font-weight: bold; color: var(--text); }
        .market-change { font-size: 12px; margin-top: 6px; font-weight: bold; }
        .positive { color: var(--green); }
        .negative { color: var(--red); }
        .loading { text-align: center; color: var(--text-dim); padding: 30px; grid-column: 1/-1; }

        /* ===== RISK ===== */
        label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-dim); }
        input, select {
            width: 100%; padding: 11px; margin-bottom: 12px; background: var(--bg-input);
            border: 1px solid var(--border); border-radius: 6px; color: var(--text);
            font-size: 15px; outline: none;
        }
        input:focus, select:focus { border-color: var(--green); }
        .symbol-info { font-size: 12px; color: var(--yellow); margin-bottom: 12px; padding: 10px; background: var(--bg-input); border-radius: 6px; }
        .section-title { color: var(--green); font-weight: bold; margin: 20px 0 10px 0; font-size: 14px; }
        .result-box { margin-top: 15px; padding: 15px; background: var(--bg-input); border-radius: 8px; font-size: 14px; line-height: 1.8; }
        .result-row { display: flex; justify-content: space-between; }

        /* ===== GRAFIK (to'liq ekran) ===== */
        #chartContainer {
            width: 100%;
            height: calc(100vh - 160px);
            min-height: 500px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }
        #tvchart { width: 100%; height: 100%; }

        .chart-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .chart-controls select { margin-bottom: 0; max-width: 250px; }
        .fullscreen-btn {
            padding: 10px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }
        .fullscreen-btn:hover { background: var(--green); color: white; border-color: var(--green); }

        /* ===== YANGILIKLAR ===== */
        .news-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 10px; }
        .news-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .news-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
        .news-date { font-size: 11px; color: var(--text-dim); margin-top: 8px; }

        /* ===== MOBIL MOSLASHISH ===== */
        @media (max-width: 600px) {
            .content { padding: 15px; }
            .menu { justify-content: flex-start; padding-right: 0; }
            .menu-btn { padding: 10px 12px; font-size: 12px; }
            .market-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .market-price { font-size: 16px; }
            .logo-wrap { width: 160px; }
            #chartContainer { height: calc(100vh - 180px); min-height: 400px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-wrap">
            <div class="logo">ZA<span>_</span>ISLAMIC</div>
        </div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="menu">
        <button class="menu-btn active" data-tab="dashboard">🏠 Dashboard</button>
        <button class="menu-btn" data-tab="risk">📊 Risk</button>
        <button class="menu-btn" data-tab="chart">📈 Grafik</button>
        <button class="menu-btn" data-tab="news">📰 Yangiliklar</button>
    </div>

    <div class="content">

        <!-- DASHBOARD -->
        <div class="tab-content active" id="dashboard">
            <h2>Bozor holati</h2>
            <div class="asset-tabs">
                <button class="asset-tab active" data-category="forex">💱 Forex</button>
                <button class="asset-tab" data-category="crypto">🪙 Kripto</button>
                <button class="asset-tab" data-category="indices">📈 Indekslar</button>
                <button class="asset-tab" data-category="stocks">📊 Aksiyalar</button>
            </div>
            <div class="market-grid" id="marketGrid">
                <div class="loading">⏳ Ma'lumotlar yuklanmoqda...</div>
            </div>
            <button onclick="loadMarketData()" style="width:100%; padding:12px; margin-top:20px; background:var(--bg-input); border:1px solid var(--border); color:var(--text); border-radius:8px; cursor:pointer; font-size:14px;">🔄 Yangilash</button>
        </div>

        <!-- RISK -->
        <div class="tab-content" id="risk">
            <h2>Risk Kalkulyator</h2>
            <label>Aktiv nomi:</label>
            <input id="rc-symbol" type="text" value="EURUSD" style="text-transform:uppercase;">
            <div id="rc-symbol-info" class="symbol-info">Aktiv turi: <b>Forex</b></div>
            <label>Balans ($):</label>
            <input id="rc-balance" type="number" value="1000">
            <div class="section-title">📊 SETIV (Lot hajmi)</div>
            <label>Lot hajmini tanlang:</label>
            <select id="rc-lot-select">
                <option value="0.01">0.01 (Mikro lot)</option>
                <option value="0.10">0.10 (Mini lot)</option>
                <option value="1.00" selected>1.00 (Standart lot)</option>
                <option value="2.00">2.00</option>
                <option value="5.00">5.00</option>
                <option value="10.00">10.00</option>
                <option value="custom">— Boshqa —</option>
            </select>
            <input id="rc-lot-manual" type="number" value="1.00" step="0.01" style="display:none;" placeholder="Lot hajmini yozing...">
            <label>Stop Loss (Pips/Punktlar):</label>
            <input id="rc-sl" type="number" value="20">
            <label>Take Profit (Pips/Punktlar):</label>
            <input id="rc-tp" type="number" value="40">
            <div id="rc-result" class="result-box"></div>
        </div>

        <!-- GRAFIK -->
        <div class="tab-content" id="chart">
            <div class="chart-controls">
                <select id="chart-symbol">
                    <option value="FX:EURUSD">EUR/USD</option>
                    <option value="FX:GBPUSD">GBP/USD</option>
                    <option value="FX:USDJPY">USD/JPY</option>
                    <option value="BITSTAMP:BTCUSD">BTC/USD</option>
                    <option value="BITSTAMP:ETHUSD">ETH/USD</option>
                    <option value="OANDA:XAUUSD">XAU/USD (Oltin)</option>
                    <option value="NASDAQ:AAPL">AAPL</option>
                    <option value="NASDAQ:TSLA">TSLA</option>
                </select>
                <button class="fullscreen-btn" id="fullscreenBtn">⛶ To'liq ekran</button>
            </div>
            <div id="chartContainer">
                <div id="tvchart"></div>
            </div>
        </div>

        <!-- YANGILIKLAR -->
        <div class="tab-content" id="news">
            <h2>Yangiliklar</h2>
            <div id="newsList">
                <div class="news-item">
                    <div class="news-title">📰 Yangiliklar yuklanmoqda...</div>
                    <div class="news-desc">Tez orada ma'lumotlar paydo bo'ladi.</div>
                </div>
            </div>
        </div>

    </div>

    <script>
    // ===== MENYU =====
    document.querySelectorAll('.menu-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            document.getElementById(this.dataset.tab).classList.add('active');

            if (this.dataset.tab === 'chart') {
                setTimeout(initChart, 100);
            }
        });
    });

    // ===== TUNGI/KUNDUZGI REJIM =====
    const themeToggle = document.getElementById('themeToggle');
    let currentTheme = 'dark';
    themeToggle.addEventListener('click', function() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme === 'light' ? 'light' : '');
        this.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
        if (chartInitialized) {
            chartInitialized = false;
            document.getElementById('tvchart').innerHTML = '';
            initChart();
        }
    });

    // ===== RISK KALKULYATOR =====
    const symbolDatabase = {
        'EURUSD': { type: 'Forex', pipValue: 10 }, 'GBPUSD': { type: 'Forex', pipValue: 10 },
        'USDJPY': { type: 'Forex', pipValue: 6.7 }, 'XAUUSD': { type: 'Oltin', pipValue: 1 },
        'BTCUSDT': { type: 'Kripto', pipValue: 1 }, 'ETHUSDT': { type: 'Kripto', pipValue: 1 },
        'AAPL': { type: 'Aksiya', pipValue: 1 }, 'TSLA': { type: 'Aksiya', pipValue: 1 },
        'US30': { type: 'Indeks', pipValue: 1 }, 'NAS100': { type: 'Indeks', pipValue: 1 }
    };

    const symbolInput = document.getElementById('rc-symbol');
    const symbolInfo = document.getElementById('rc-symbol-info');
    const balanceInput = document.getElementById('rc-balance');
    const lotSelect = document.getElementById('rc-lot-select');
    const lotManual = document.getElementById('rc-lot-manual');
    const slInput = document.getElementById('rc-sl');
    const tpInput = document.getElementById('rc-tp');
    const resultDiv = document.getElementById('rc-result');
    let hiddenPipValue = 10;

    function detectSymbol() {
        const symbol = symbolInput.value.trim().toUpperCase();
        if (symbolDatabase[symbol]) {
            const data = symbolDatabase[symbol];
            symbolInfo.innerHTML = `Aktiv turi: <b>${data.type}</b>`;
            hiddenPipValue = data.pipValue;
        } else {
            symbolInfo.innerHTML = `Aktiv turi: <b>Noma'lum</b> (taxminiy hisob)`;
            hiddenPipValue = 1;
        }
        calculate();
    }

    function getLotSize() {
        if (lotSelect.value === 'custom') return parseFloat(lotManual.value) || 0.01;
        return parseFloat(lotSelect.value) || 0.01;
    }

    lotSelect.addEventListener('change', function() {
        if (this.value === 'custom') { lotManual.style.display = 'block'; lotManual.focus(); }
        else { lotManual.style.display = 'none'; }
        calculate();
    });

    function calculate() {
        const balance = parseFloat(balanceInput.value) || 0;
        const lot = getLotSize();
        const sl = parseFloat(slInput.value) || 0;
        const tp = parseFloat(tpInput.value) || 0;
        const slDollar = lot * sl * hiddenPipValue;
        const tpDollar = lot * tp * hiddenPipValue;
        const riskPct = balance > 0 ? (slDollar / balance) * 100 : 0;
        const rr = slDollar > 0 ? (tpDollar / slDollar) : 0;

        let riskColor = riskPct > 5 ? '#F44336' : (riskPct > 2 ? '#FFC107' : '#4CAF50');
        let rrColor = rr >= 2 ? '#4CAF50' : (rr >= 1 ? '#FFC107' : '#F44336');

        resultDiv.innerHTML = `
            <div class="result-row" style="color:${riskColor};"><span>🔴 Xavf (SL):</span><span>$${slDollar.toFixed(2)} (${riskPct.toFixed(2)}%)</span></div>
            <div class="result-row" style="color:#2196F3;"><span>🟢 Foyda (TP):</span><span>$${tpDollar.toFixed(2)}</span></div>
            <div class="result-row" style="color:${rrColor}; border-top:1px solid var(--border); margin-top:5px; padding-top:5px;"><span>⚖️ Risk/Reward:</span><span>1 : ${rr.toFixed(2)}</span></div>
        `;
    }

    symbolInput.addEventListener('input', detectSymbol);
    balanceInput.addEventListener('input', calculate);
    lotManual.addEventListener('input', calculate);
    slInput.addEventListener('input', calculate);
    tpInput.addEventListener('input', calculate);
    detectSymbol();

    // ===== DASHBOARD =====
    let currentCategory = 'forex';

    const assets = {
        forex: [
            { name: 'EUR/USD', symbol: 'EURUSD' }, { name: 'GBP/USD', symbol: 'GBPUSD' },
            { name: 'USD/JPY', symbol: 'USDJPY' }, { name: 'AUD/USD', symbol: 'AUDUSD' },
            { name: 'USD/CAD', symbol: 'USDCAD' }, { name: 'USD/CHF', symbol: 'USDCHF' },
            { name: 'NZD/USD', symbol: 'NZDUSD' }, { name: 'EUR/GBP', symbol: 'EURGBP' },
            { name: 'XAU/USD', symbol: 'XAUUSD' }, { name: 'XAG/USD', symbol: 'XAGUSD' }
        ],
        crypto: [
            { name: 'BTC/USDT', symbol: 'BTCUSDT' }, { name: 'ETH/USDT', symbol: 'ETHUSDT' },
            { name: 'BNB/USDT', symbol: 'BNBUSDT' }, { name: 'SOL/USDT', symbol: 'SOLUSDT' },
            { name: 'XRP/USDT', symbol: 'XRPUSDT' }, { name: 'ADA/USDT', symbol: 'ADAUSDT' },
            { name: 'DOGE/USDT', symbol: 'DOGEUSDT' }, { name: 'DOT/USDT', symbol: 'DOTUSDT' },
            { name: 'MATIC/USDT', symbol: 'MATICUSDT' }, { name: 'LINK/USDT', symbol: 'LINKUSDT' }
        ],
        indices: [
            { name: 'US30', symbol: 'US30' }, { name: 'NAS100', symbol: 'NAS100' },
            { name: 'SPX500', symbol: 'SPX500' }, { name: 'GER40', symbol: 'GER40' },
            { name: 'UK100', symbol: 'UK100' }, { name: 'JP225', symbol: 'JP225' },
            { name: 'HK50', symbol: 'HK50' }, { name: 'AUS200', symbol: 'AUS200' },
            { name: 'FRA40', symbol: 'FRA40' }, { name: 'EU50', symbol: 'EU50' }
        ],
        stocks: [
            { name: 'AAPL', symbol: 'AAPL' }, { name: 'TSLA', symbol: 'TSLA' },
            { name: 'MSFT', symbol: 'MSFT' }, { name: 'GOOGL', symbol: 'GOOGL' },
            { name: 'AMZN', symbol: 'AMZN' }, { name: 'META', symbol: 'META' },
            { name: 'NVDA', symbol: 'NVDA' }, { name: 'NFLX', symbol: 'NFLX' },
            { name: 'AMD', symbol: 'AMD' }, { name: 'INTC', symbol: 'INTC' }
        ]
    };

    document.querySelectorAll('.asset-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.asset-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            loadMarketData();
        });
    });

    async function loadMarketData() {
        const grid = document.getElementById('marketGrid');
        grid.innerHTML = '<div class="loading">⏳ Ma\'lumotlar yuklanmoqda...</div>';
        const list = assets[currentCategory];

        if (currentCategory === 'crypto') {
            try {
                const ids = list.map(i => i.symbol.replace('USDT','').toLowerCase()).join(',');
                const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
                const data = await res.json();
                let html = '';
                list.forEach(item => {
                    const coinId = item.symbol.replace('USDT','').toLowerCase();
                    const info = data[coinId];
                    if (info) {
                        const isPositive = info.usd_24h_change >= 0;
                        html += `
                            <div class="market-card">
                                <div class="market-name">${item.name}</div>
                                <div class="market-price">$${info.usd.toLocaleString()}</div>
                                <div class="market-change ${isPositive ? 'positive' : 'negative'}">
                                    ${isPositive ? '▲' : '▼'} ${Math.abs(info.usd_24h_change).toFixed(2)}%
                                </div>
                            </div>`;
                    }
                });
                grid.innerHTML = html;
            } catch (e) {
                grid.innerHTML = '<div class="loading">⚠️ Kripto ma\'lumotlari yuklanmadi.</div>';
            }
            return;
        }

        // Forex, Indekslar, Aksiyalar uchun mock
        let html = '';
        list.forEach(item => {
            const base = currentCategory === 'indices' ? 10000 : (currentCategory === 'stocks' ? 100 : 1);
            const price = (Math.random() * base + base * 0.5).toFixed(currentCategory === 'indices' ? 0 : 2);
            const change = (Math.random() * 3 - 1.5).toFixed(2);
            const isPositive = change >= 0;
            html += `
                <div class="market-card">
                    <div class="market-name">${item.name}</div>
                    <div class="market-price">${currentCategory === 'stocks' ? '$' : ''}${price}</div>
                    <div class="market-change ${isPositive ? 'positive' : 'negative'}">
                        ${isPositive ? '▲' : '▼'} ${Math.abs(change)}%
                    </div>
                </div>`;
        });
        grid.innerHTML = html;
    }

    // ===== TRADINGVIEW GRAFIK =====
    let chartInitialized = false;
    function initChart() {
        if (chartInitialized) return;
        const symbol = document.getElementById('chart-symbol').value;
        document.getElementById('tvchart').innerHTML = '';
        new TradingView.widget({
            "container_id": "tvchart",
            "autosize": true,
            "symbol": symbol,
            "interval": "D",
            "timezone": "Asia/Tashkent",
            "theme": currentTheme === 'dark' ? 'dark' : 'light',
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "details": true,
            "withdateranges": true,
            "save_image": true,
            "studies": ["MASimple@tv-basicstudies"],
            "show_popup_button": true,
            "popup_width": "1000",
            "popup_height": "650"
        });
        chartInitialized = true;
    }

    document.getElementById('chart-symbol').addEventListener('change', function() {
        chartInitialized = false;
        initChart();
    });

    // To'liq ekran tugmasi
    document.getElementById('fullscreenBtn').addEventListener('click', function() {
        const el = document.getElementById('chartContainer');
        if (!document.fullscreenElement) {
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    });

    // ===== YANGILIKLAR =====
    function loadNews() {
        document.getElementById('newsList').innerHTML = `
            <div class="news-item">
                <div class="news-title">📈 Bozor yangiliklari</div>
                <div class="news-desc">Forex va kripto bozoridagi so'nggi o'zgarishlar tez orada shu yerda ko'rinadi.</div>
                <div class="news-date">Tez orada...</div>
            </div>
        `;
    }

    // Boshlang'ich yuklash
    loadMarketData();
    loadNews();
    setInterval(loadMarketData, 60000);
    </script>
</body>
</html>
